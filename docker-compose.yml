version: '3.5'

## FOR TEST AND DEVELOPMENT ONLY, DO NOT USE IN PRODUCTION   ##

name: hello

services:
  backend:
    container_name: backend
    image: hellodecentralized/hello-back:staging
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - network-backend

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    user: postgres
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - network-backend
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    container_name: redis
    image: redis/redis-stack-server:latest
    restart: always
    ports:
      - '6379:6379'
    networks:
      - network-backend
  nodejs-server:
    container_name: nodejs-server-dev
    build:
      context: ./node
      dockerfile: ./Dockerfile.dev # Adjust if your Dockerfile has a different name or path
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./node:/usr/src/app # This mounts your host node directory to the container's working directory
      - ./arweave-wallet.json:/usr/src/app/arweave-wallet.json:ro
      - /usr/src/app/node_modules # Persists node_modules folder to avoid being overridden by the bind mount
    networks:
      - network-backend


networks:
  network-backend:
volumes:
  postgres-data:
    external: true
    name: postgres-data
